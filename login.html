<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MUST online application</title>
    <meta name="description" content="Login to your account on the MUST online application platform. By Innocent Ssemyalo from morden technologies uganda.">
    <meta name="keywords" content="HTML, CSS, JavaScript, web development, tutorials">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Login Form -->
    <div class="login-container">
        <img src="ham.png">
        <h1>Welcome to MUST online application platform!</h1>
        <div class="portal-name">
        Online Application Portal
        </div>

        <!--These are the login credentials-->
        <form action="" method="post">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter your username here!">

            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>

        <!-- Create Account button for users who don't have an account -->
        <p><b>Don't have an account!</b><a href="signup.html"><button>Create Account</button></a></p>
    </div>
</body>
</html>
